/* ======== ETA Tracker styles ======== */
:root{
  --bg:#0e1117; --card:#161b26; --card2:#1c2333; --ink:#f2f5fa; --muted:#8b95a8;
  --accent:#31c48d; --accent2:#f6ad37; --danger:#f05252; --radius:18px;
  font-size:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  min-height:100vh; padding:16px 14px 90px;
}
header{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 14px}
header h1{font-size:1.05rem;margin:0;letter-spacing:.4px;font-weight:700}
header h1 span{color:var(--accent)}
.badge{font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);
  border:1px solid rgba(49,196,141,.35);border-radius:99px;padding:4px 10px;background:rgba(49,196,141,.08)}
#nowClock{
  text-align:center;font-variant-numeric:tabular-nums;font-weight:800;
  font-size:clamp(2.6rem,13vw,4rem);letter-spacing:.02em;margin:4px 0 2px;line-height:1;
}
#nowDate{text-align:center;color:var(--muted);font-size:.8rem;margin-bottom:18px;letter-spacing:.08em;text-transform:uppercase}

form#addForm{
  background:var(--card);border:1px solid #232c3d;border-radius:var(--radius);
  padding:14px;margin-bottom:18px;display:flex;flex-direction:column;gap:10px;
}
form#addForm .row{display:flex;gap:8px}
input[type=text],input[type=datetime-local]{
  flex:1;min-width:0;background:var(--card2);border:1px solid #2a3448;color:var(--ink);
  border-radius:12px;padding:12px 12px;font-size:1rem;outline:none;
}
input:focus{border-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{
  background:var(--card2);color:var(--ink);border:1px solid #2a3448;border-radius:99px;
  padding:8px 13px;font-size:.85rem;cursor:pointer;font-weight:600;
}
.chips button:active{transform:scale(.95)}
#addBtn{
  background:var(--accent);color:#06281c;border:none;border-radius:12px;padding:14px;
  font-size:1.05rem;font-weight:800;cursor:pointer;letter-spacing:.02em;
}
#addBtn:active{transform:scale(.98)}

.card{
  background:var(--card);border:1px solid #232c3d;border-radius:var(--radius);
  padding:16px 14px 8px;margin-bottom:14px;position:relative;overflow:hidden;
}
.card.done{border-color:rgba(49,196,141,.6)}
.card .label{font-size:1.05rem;font-weight:700;margin:0 34px 2px 2px;word-break:break-word}
.card .target{color:var(--muted);font-size:.75rem;margin:0 2px 10px}
.card .bigleft{
  font-variant-numeric:tabular-nums;font-weight:800;line-height:1;
  font-size:clamp(2.2rem,11vw,3.4rem);margin:2px 2px 10px;letter-spacing:.01em;
}
.card.done .bigleft{color:var(--accent)}
.card .del{
  position:absolute;top:10px;right:10px;background:transparent;border:none;color:var(--muted);
  font-size:1.15rem;cursor:pointer;padding:6px;line-height:1;
}
.card .del:hover{color:var(--danger)}
.fdwrap{display:flex;justify-content:center;padding-bottom:10px}
.arrived{
  text-align:center;font-size:2rem;font-weight:900;color:var(--accent);
  padding:10px 0 18px;letter-spacing:.06em;
}
#empty{
  text-align:center;color:var(--muted);padding:34px 10px;font-size:.95rem;
  border:1px dashed #2a3448;border-radius:var(--radius);
}
footer{
  position:fixed;bottom:0;left:0;right:0;text-align:center;padding:10px;
  font-size:.65rem;color:var(--muted);background:linear-gradient(transparent,var(--bg) 40%);
  letter-spacing:.06em;
}
/* shrink flipdown a touch so it fits the 430px ClientOS window */
.flipdown{transform:scale(.9);transform-origin:top center}
@media (max-width:420px){.flipdown{transform:scale(.8)}}
</style>
</head>
<body>
<header>
  <h1>ETA <span>TRACKER</span> · Menu Sadah</h1>
  <span class="badge" id="netBadge">offline ready</span>
</header>

<div id="nowClock">--:--:--</div>
<div id="nowDate"></div>

<form id="addForm" autocomplete="off">
  <div class="row"><input type="text" id="etaLabel" placeholder="What are we waiting for? (e.g. Cafe X menu delivery)" maxlength="80"></div>
  <div class="row"><input type="datetime-local" id="etaWhen"></div>
  <div class="chips">
    <button type="button" data-min="15">+15m</button>
    <button type="button" data-min="30">+30m</button>
    <button type="button" data-min="60">+1h</button>
    <button type="button" data-min="120">+2h</button>
    <button type="button" data-min="1440">+1 day</button>
    <button type="button" data-min="2880">+2 days</button>
  </div>
  <button id="addBtn" type="submit">＋ Track ETA</button>
</form>

<div id="cards"></div>
<div id="empty">No ETAs yet. Add one above — it stays saved on this Mac, even offline, even after restart.</div>

<footer>saved locally · flip clock by FlipDown.js (MIT) · timers are clock-based, switching apps/chats never desyncs them</footer>

<script>

/* ======== ETA Tracker app ======== */
(function(){
  "use strict";
  var STORE_KEY = "menusadah_eta_v1";
  var cardsEl = document.getElementById("cards");
  var emptyEl = document.getElementById("empty");
  var labelEl = document.getElementById("etaLabel");
  var whenEl  = document.getElementById("etaWhen");
  var instances = {}; // id -> FlipDown instance (so we can clearInterval on delete)

  function load(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      var arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr.filter(function(e){ return e && e.id && e.targetMs; }) : [];
    }catch(e){ return []; }
  }
  function save(arr){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(arr)); }catch(e){}
  }
  var etas = load();

  function fmtTarget(ms){
    var d = new Date(ms);
    return d.toLocaleString(undefined, {weekday:"short", day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"});
  }
  function bigLeftText(ms){
    var diff = ms - Date.now();
    if(diff <= 0) return "00:00";
    var s = Math.floor(diff/1000);
    var d = Math.floor(s/86400), h = Math.floor(s%86400/3600), m = Math.floor(s%3600/60), sec = s%60;
    if(d > 0) return d + "d " + h + "h";
    if(h > 0) return h + "h " + String(m).padStart(2,"0") + "m";
    return String(m).padStart(2,"0") + ":" + String(sec).padStart(2,"0");
  }

  function render(){
    // tear down old flip clocks so no orphan intervals keep running
    Object.keys(instances).forEach(function(id){
      try{ clearInterval(instances[id].countdown); }catch(e){}
      delete instances[id];
    });
    cardsEl.innerHTML = "";
    etas.sort(function(a,b){ return a.targetMs - b.targetMs; });
    emptyEl.style.display = etas.length ? "none" : "block";

    etas.forEach(function(eta){
      var done = eta.targetMs <= Date.now();
      var card = document.createElement("div");
      card.className = "card" + (done ? " done" : "");
      card.innerHTML =
        '<button class="del" title="Remove" aria-label="Remove">✕</button>' +
        '<p class="label"></p>' +
        '<p class="target"></p>' +
        '<div class="bigleft" id="big-' + eta.id + '"></div>' +
        (done
          ? '<div class="arrived">✓ ARRIVED</div>'
          : '<div class="fdwrap"><div id="fd-' + eta.id + '" class="flipdown"></div></div>');
      card.querySelector(".label").textContent = eta.label || "Untitled ETA";
      card.querySelector(".target").textContent = "ETA " + fmtTarget(eta.targetMs);
      card.querySelector(".del").addEventListener("click", function(){
        etas = etas.filter(function(e){ return e.id !== eta.id; });
        save(etas); render();
      });
      cardsEl.appendChild(card);
      document.getElementById("big-" + eta.id).textContent = done ? "✓" : bigLeftText(eta.targetMs);

      if(!done){
        var fd = new FlipDown(Math.floor(eta.targetMs/1000), "fd-" + eta.id, {theme:"dark"})
          .start()
          .ifEnded(function(){ render(); });
        instances[eta.id] = fd;
      }
    });
  }

  // big minutes/seconds line ticks every second, derived from wall clock (never drifts)
  setInterval(function(){
    etas.forEach(function(eta){
      var el = document.getElementById("big-" + eta.id);
      if(el && eta.targetMs > Date.now()) el.textContent = bigLeftText(eta.targetMs);
    });
  }, 1000);

  // live clock
  var clockEl = document.getElementById("nowClock"), dateEl = document.getElementById("nowDate");
  function tickClock(){
    var n = new Date();
    clockEl.textContent = n.toLocaleTimeString(undefined, {hour:"2-digit", minute:"2-digit", second:"2-digit"});
    dateEl.textContent = n.toLocaleDateString(undefined, {weekday:"long", day:"numeric", month:"long"});
  }
  tickClock(); setInterval(tickClock, 1000);

  // when the window comes back after chat-switching, force everything current immediately
  document.addEventListener("visibilitychange", function(){
    if(!document.hidden){
      tickClock();
      var anyExpired = etas.some(function(e){ return e.targetMs <= Date.now(); });
      if(anyExpired) render();
      else etas.forEach(function(eta){
        var el = document.getElementById("big-" + eta.id);
        if(el) el.textContent = bigLeftText(eta.targetMs);
        var fd = instances[eta.id];
        try{ if(fd && typeof fd._tick === "function") fd._tick(); }catch(e){}
      });
    }
  });

  // form
  document.querySelectorAll(".chips button").forEach(function(btn){
    btn.addEventListener("click", function(){
      var t = new Date(Date.now() + parseInt(btn.dataset.min,10)*60000);
      t.setSeconds(0,0);
      var pad = function(x){ return String(x).padStart(2,"0"); };
      whenEl.value = t.getFullYear()+"-"+pad(t.getMonth()+1)+"-"+pad(t.getDate())+"T"+pad(t.getHours())+":"+pad(t.getMinutes());
    });
  });
  document.getElementById("addForm").addEventListener("submit", function(ev){
    ev.preventDefault();
    if(!whenEl.value){ whenEl.focus(); return; }
    var ms = new Date(whenEl.value).getTime();
    if(isNaN(ms)){ whenEl.focus(); return; }
    etas.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
      label: labelEl.value.trim(),
      targetMs: ms,
      createdMs: Date.now()
    });
    save(etas);
    labelEl.value = ""; whenEl.value = "";
    render();
  });

  // online/offline badge (purely informational — app never needs network)
  var badge = document.getElementById("netBadge");
  function net(){ badge.textContent = navigator.onLine ? "offline ready" : "offline mode"; }
  window.addEventListener("online", net); window.addEventListener("offline", net); net();

  render();
})();
</script>
</body>
</html>
