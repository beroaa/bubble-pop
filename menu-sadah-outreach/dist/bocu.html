tion:absolute;inset:0;background:radial-gradient(122% 92% at 50% 38%,#FEFBF4 0%,#F8F0DF 52%,#EFE1C4 100%)}.pat-rings{position:absolute;left:50%;top:44%;width:min(80vw,460px);transform:translate(-50%,-50%);opacity:.3;animation:patBreathe 10s ease-in-out infinite}.pat-rings svg{width:100%;height:auto;display:block;filter:drop-shadow(0 6px 16px rgba(176,137,46,.22))}@keyframes patBreathe{50%{opacity:.46;transform:translate(-50%,-50%) rotate(4deg) scale(1.03)}}.pat-rings .pr{stroke-dasharray:378;stroke-dashoffset:378;animation:patDraw 1.4s cubic-bezier(.55,0,.2,1) .1s forwards}.pat-rings .pr2{animation-delay:.45s}@keyframes patDraw{to{stroke-dashoffset:0}}.pat-sugar{position:absolute;inset:0;overflow:hidden;pointer-events:none}.pat-flake{position:absolute;top:-5vh;border-radius:50%;background:radial-gradient(circle,rgba(224,171,74,.85),rgba(200,150,60,.22) 70%);box-shadow:0 0 4px rgba(200,150,60,.4);animation:patFall linear infinite}@keyframes patFall{0%{transform:translateY(-5vh) translateX(0);opacity:0}12%{opacity:.9}88%{opacity:.8}100%{transform:translateY(112vh) translateX(var(--sx));opacity:0}}@media(prefers-reduced-motion:reduce){.pat-rings,.pat-flake,.pat-rings .pr{animation:none}.pat-flake{display:none}.pat-rings .pr{stroke-dashoffset:0}}</style>
