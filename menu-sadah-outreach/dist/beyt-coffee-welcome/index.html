<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BEYt · Menu Sadah</title>
<!--
  BEYt welcome gift page · Menu Sadah
  NOTE FOR BERO: WhatsApp +961 76 761 390 is UNVERIFIED, and the Instagram handle is UNCONFIRMED.
  That is why there is no WhatsApp button and no IG handle on this page. Reply flow mirrors base-coffee.
  Wire them in only after confirmation.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Patrick+Hand&family=Work+Sans:wght@400;600;800&family=Noto+Kufi+Arabic:wght@400;700;800&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --rose:#D46C6E;--gold:#C79503;--ochre:#967100;--sage:#C3C59A;
    --ink:#382900;--paper:#FFFDF6;--paper2:#FBF6E8;--card:#FFFEFA;
    --line:rgba(56,41,0,.16);--line2:rgba(56,41,0,.32)
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{background:var(--paper);color:var(--ink);font-family:"Work Sans","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.55;overflow-x:hidden}
  body.ar{font-family:"Noto Kufi Arabic","Segoe UI",Tahoma,sans-serif}
  /* faint hand-laid paper grain + ink wash */
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55;
    background-image:
      radial-gradient(circle at 12% 8%,rgba(199,149,3,.07),transparent 42%),
      radial-gradient(circle at 88% 16%,rgba(212,108,110,.06),transparent 40%),
      radial-gradient(circle at 50% 96%,rgba(195,197,154,.12),transparent 46%),
      repeating-linear-gradient(0deg,rgba(56,41,0,.018) 0 2px,transparent 2px 5px)}
  .wrap{max-width:600px;margin:0 auto;padding:0 20px 84px;position:relative;z-index:1}

  .hand{font-family:"Caveat",cursive}
  body.ar .hand{font-family:"Aref Ruqaa","Noto Kufi Arabic",serif}

  /* sketchy hand-inked frame */
  .inkframe{border:2px solid var(--ink);border-radius:255px 18px 225px 18px/18px 225px 18px 255px;background:var(--card);position:relative}
  .inkframe::after{content:"";position:absolute;inset:4px;border:1px dashed var(--line2);border-radius:inherit;pointer-events:none}

  .top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:rgba(255,253,246,.93);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:2px solid var(--ink)}
  .top .bm{display:flex;align-items:center;gap:10px}
  .top .mark{width:36px;height:36px;flex:0 0 auto}
  .top .mark svg{width:100%;height:100%;display:block}
  .top b{font-weight:800;font-size:14px;letter-spacing:.22em;text-transform:uppercase}
  body.ar .top b{letter-spacing:.02em}
  .top b small{display:block;font-size:10px;letter-spacing:.1em;color:var(--ochre);font-weight:700}
  .lang{display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--paper);border:none;border-radius:999px;padding:11px 18px;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit}
  .lang svg{width:16px;height:16px}
  @keyframes hintPulse{0%,52%,100%{transform:scale(1)}12%{transform:scale(1.1) rotate(-4deg)}26%{transform:scale(1.06) rotate(4deg)}40%{transform:scale(1.09) rotate(0)}}
  .hintme{animation:hintPulse 2.4s ease-in-out infinite}

  /* ---------- HERO: the house assembles ---------- */
  .hero{text-align:center;padding:38px 4px 6px}
  .kick{color:var(--ochre);font-weight:800;font-size:13px;letter-spacing:.22em;text-transform:uppercase;margin-bottom:16px}
  body.ar .kick{letter-spacing:.05em}
  .housebox{width:min(240px,64vw);margin:0 auto 8px;position:relative}
  .housebox svg{width:100%;height:auto;display:block;overflow:visible}
  .beytword{font-family:"Aref Ruqaa","Noto Kufi Arabic",serif;font-size:34px;color:var(--ink);line-height:1;margin-top:-6px}
  .beytword em{font-style:normal;color:var(--rose)}
  .beytsub{font-size:13px;font-weight:700;color:var(--ochre);letter-spacing:.14em;text-transform:uppercase;margin-top:6px}
  body.ar .beytsub{letter-spacing:.03em}

  /* cube assembly animation: faces fly in + ink lines draw */
  .f-top,.f-left,.f-right,.f-roofline{opacity:0}
  .f-top{animation:faceTop 1s cubic-bezier(.2,1.4,.4,1) .15s forwards}
  .f-left{animation:faceLeft 1s cubic-bezier(.2,1.4,.4,1) .45s forwards}
  .f-right{animation:faceRight 1s cubic-bezier(.2,1.4,.4,1) .75s forwards}
  @keyframes faceTop{from{opacity:0;transform:translate(0,-42px)}to{opacity:1;transform:none}}
  @keyframes faceLeft{from{opacity:0;transform:translate(-42px,26px)}to{opacity:1;transform:none}}
  @keyframes faceRight{from{opacity:0;transform:translate(42px,26px)}to{opacity:1;transform:none}}
  .draws{stroke-dasharray:340;stroke-dashoffset:340;animation:inkdraw 1.1s ease 1.2s forwards}
  @keyframes inkdraw{to{stroke-dashoffset:0}}
  .lateshow{opacity:0;animation:fadeup .7s ease 1.7s forwards}
  .lateshow2{opacity:0;animation:fadeup .7s ease 2s forwards}
  @keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .steam{opacity:0;animation:steamFloat 3.2s ease-in-out 2.2s infinite}
  @keyframes steamFloat{0%{opacity:0;transform:translateY(4px)}30%{opacity:.7}70%{opacity:.4}100%{opacity:0;transform:translateY(-12px)}}
  @media(prefers-reduced-motion:reduce){
    .hintme,.steam{animation:none}
    .f-top,.f-left,.f-right,.lateshow,.lateshow2{animation:none;opacity:1}
    .draws{animation:none;stroke-dashoffset:0}
  }

  h1{font-weight:800;font-size:clamp(32px,8.6vw,50px);line-height:1.1;letter-spacing:-.01em;margin-top:14px}
  body.ar h1{letter-spacing:0}
  h1 .u{position:relative;white-space:nowrap}
  h1 .u::after{content:"";position:absolute;left:-2%;right:-2%;bottom:.04em;height:.28em;background:var(--sage);z-index:-1;border-radius:40% 60% 55% 45%/60% 40% 60% 40%;opacity:.8}
  .hero .sub{margin:14px auto 0;max-width:440px;font-size:18px;font-weight:600;opacity:.85}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--gold);color:var(--paper);text-decoration:none;font-weight:800;font-size:17px;padding:17px 30px;border-radius:999px;border:2px solid var(--ink);cursor:pointer;font-family:inherit;transition:transform .15s ease,filter .15s ease;box-shadow:3px 3px 0 var(--ink)}
  .btn:hover{transform:translate(-1px,-2px);filter:brightness(1.04)}
  .btn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
  .btn.ink{background:var(--ink);color:var(--paper)}
  .btn.rose{background:var(--rose)}
  .btn.big{font-size:19px;padding:19px 32px;width:100%;max-width:400px}
  .btn svg{width:19px;height:19px;flex:0 0 auto}
  .cta-lg{margin-top:26px}
  section{margin-top:30px}

  /* ---------- personal letter ---------- */
  .letter{padding:26px 22px;text-align:center}
  .letter .salut{font-size:26px;color:var(--ochre);margin-bottom:10px}
  .letter p{font-size:17px;font-weight:600;max-width:460px;margin:0 auto;line-height:1.75}
  .letter p b{color:var(--rose)}
  .letter .sig{margin-top:14px;font-size:24px;color:var(--ink)}

  /* ---------- FREE offer card ---------- */
  .freecard{background:var(--ink);color:var(--paper);border-radius:26px 12px 26px 12px;padding:36px 24px 32px;text-align:center;position:relative;overflow:hidden;border:2px solid var(--ink)}
  .freecard::before{content:"";position:absolute;inset:7px;border:1.5px dashed rgba(255,253,246,.35);border-radius:20px 8px 20px 8px;pointer-events:none}
  .freecard::after{content:"";position:absolute;inset:0;opacity:.7;pointer-events:none;background:radial-gradient(circle at 16% 14%,rgba(199,149,3,.3),transparent 46%),radial-gradient(circle at 86% 88%,rgba(212,108,110,.22),transparent 44%)}
  .freecard>*{position:relative;z-index:1}
  .freecard .lbl{color:var(--sage);font-weight:800;font-size:13px;letter-spacing:.16em;text-transform:uppercase}
  body.ar .freecard .lbl{letter-spacing:.03em}
  .freecard .was{font-size:22px;font-weight:700;opacity:.6;text-decoration:line-through;text-decoration-color:var(--rose);text-decoration-thickness:3px;margin-top:14px}
  .freecard .big{font-weight:800;font-size:clamp(52px,17vw,88px);line-height:1;color:var(--gold);letter-spacing:.02em;margin-top:4px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
  .freecard .fine{font-size:14.5px;opacity:.82;margin-top:14px;max-width:380px;margin-left:auto;margin-right:auto}

  .points{display:grid;gap:12px}
  .pt{display:flex;align-items:center;gap:16px;background:var(--paper2);border:2px solid var(--ink);border-radius:120px 16px 120px 16px/16px 120px 16px 120px;padding:18px 20px}
  .pt .n{flex:0 0 auto;width:46px;height:46px;border-radius:50% 44% 52% 48%;display:grid;place-items:center;color:var(--paper);border:2px solid var(--ink)}
  .pt:nth-child(1) .n{background:var(--rose)}.pt:nth-child(2) .n{background:var(--gold)}.pt:nth-child(3) .n{background:var(--ochre)}
  .pt .n svg{width:24px;height:24px}
  .pt .tx b{display:block;font-size:18.5px;font-weight:800}
  .pt .tx span{font-size:15px;opacity:.75}

  .why{text-align:center;font-size:19px;font-weight:700;line-height:1.55;padding:8px 6px;max-width:470px;margin:0 auto}
  .why .hl{color:var(--rose)}

  /* ---------- we studied you ---------- */
  .h2{text-align:center;font-weight:800;font-size:15px;letter-spacing:.18em;text-transform:uppercase;color:var(--ochre);margin-bottom:6px}
  body.ar .h2{letter-spacing:.03em}
  .h2sub{text-align:center;font-size:15px;font-weight:600;opacity:.75;margin-bottom:18px}
  .studied{display:grid;gap:14px}
  .st{overflow:hidden;border:2px solid var(--ink);border-radius:22px 10px 22px 10px;background:var(--card)}
  .st .ph{position:relative;height:170px;background:var(--sage)}
  .st .ph img{width:100%;height:100%;object-fit:cover;display:block;filter:sepia(.12) saturate(1.05)}
  .st .ph::after{content:"";position:absolute;inset:0;box-shadow:inset 0 -46px 40px -30px rgba(56,41,0,.45)}
  .st .tag{position:absolute;top:12px;inset-inline-start:12px;background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ochre)}
  body.ar .st .tag{letter-spacing:0}
  .st .bd{padding:18px 20px 20px}
  .st .bd b{display:block;font-size:19px;font-weight:800;margin-bottom:6px}
  .st .bd b i{font-style:normal;color:var(--rose)}
  .st .bd p{font-size:15.5px;opacity:.85}

  /* ---------- ready kit ---------- */
  .qrhero{display:flex;align-items:center;gap:16px;padding:18px;margin-bottom:12px}
  .qrhero .qr{width:98px;height:98px;background:#fff;border:2px solid var(--ink);border-radius:14px 6px 14px 6px;padding:7px;flex:0 0 auto}
  .qrhero .qr img{width:100%;height:100%;display:block}
  .qrhero .t b{display:block;font-size:18px;font-weight:800;margin-bottom:2px}
  .qrhero .t span{font-size:13.5px;opacity:.75;display:block;margin-bottom:10px}
  .agrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .atile{background:var(--paper2);border:2px solid var(--ink);border-radius:16px 8px 16px 8px;padding:16px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-decoration:none;color:var(--ink);transition:transform .15s,box-shadow .15s}
  .atile:hover{transform:translateY(-3px);box-shadow:3px 3px 0 var(--ink)}
  .atile .ic{width:44px;height:44px;border-radius:12px 5px 12px 5px;background:var(--ink);color:var(--gold);display:grid;place-items:center}
  .atile .ic svg{width:23px;height:23px}
  .atile b{font-size:15.5px}
  .atile .go{margin-top:auto;font-size:12.5px;font-weight:800;color:var(--ochre);display:flex;align-items:center;gap:5px}
  .atile .go svg{width:13px;height:13px}
  @media(max-width:400px){.agrid{grid-template-columns:1fr}}

  .chips{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
  .chip{background:var(--card);border:2px solid var(--line2);border-radius:999px;padding:11px 18px;font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:8px}
  .chip svg{width:16px;height:16px;color:var(--rose)}

  .reply{text-align:center;padding:14px 6px 0}
  .reply .handline{font-size:27px;color:var(--ochre);margin-bottom:8px}
  .reply p{font-size:21px;font-weight:800;max-width:440px;margin:0 auto 18px;line-height:1.4}
  .foot{text-align:center;padding:36px 10px 0;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--ochre);font-weight:700;opacity:.9}
  body.ar .foot{letter-spacing:.02em}

  /* ============================================================
     BIG + ALIVE pass · type scale up, per-section accents,
     scroll reveals, marker swipes, gift badge. Toggle-safe:
     everything is block-level or CSS-only, no per-letter Arabic.
     ============================================================ */

  /* --- per-section accent colors, cycling the palette --- */
  .letter{--acc:var(--rose)}
  .freecard{--acc:var(--gold)}
  .points{--acc:var(--ochre)}
  .why{--acc:var(--rose)}
  section:nth-of-type(5){--acc:var(--rose)}
  section:nth-of-type(7){--acc:var(--ochre)}
  .chips{--acc:var(--gold)}

  /* --- display type goes BIG with hand-inked personality --- */
  h1{font-size:clamp(38px,10.5vw,60px);line-height:1.06}
  .hero .sub{font-size:clamp(19px,5vw,22px);opacity:.92;color:#4a3a08;max-width:470px}
  .beytword{font-size:clamp(40px,11vw,52px)}
  .beytsub{font-size:14px}
  .kick{font-size:14px;color:var(--rose)}
  .h2{font-family:"Patrick Hand","Caveat",cursive;font-size:clamp(2rem,8vw,3rem);font-weight:400;text-transform:none;letter-spacing:0;line-height:1.12;color:var(--acc,var(--ochre));transform:rotate(-1.5deg)}
  body.ar .h2{font-family:"Aref Ruqaa","Noto Kufi Arabic",serif;transform:rotate(0)}
  .h2sub{font-size:1.06rem;opacity:.85;color:#4a3a08}

  /* --- letter section --- */
  .letter .salut{font-size:clamp(30px,8.5vw,44px);color:var(--acc);line-height:1.15}
  .letter p{font-size:1.15rem;color:#443305}
  .letter .sig{font-size:clamp(24px,7vw,32px)}

  /* --- FREE offer card: impossible to ignore --- */
  .freecard{overflow:visible;margin-top:44px}
  .freecard::after{border-radius:inherit}
  .freecard .lbl{font-size:15.5px;color:var(--sage)}
  .freecard .was{display:inline-block;font-size:clamp(32px,10vw,50px);font-weight:800;opacity:.75;text-decoration-thickness:5px;transform:rotate(-2deg)}
  .freecard .big{font-family:"Patrick Hand","Caveat",cursive;font-weight:400;font-size:clamp(80px,26vw,140px);letter-spacing:.01em;transform:rotate(-1.5deg);text-shadow:0 3px 0 rgba(0,0,0,.4)}
  body.ar .freecard .big{font-family:"Aref Ruqaa","Noto Kufi Arabic",serif;font-weight:700}
  .freecard .fine{font-size:1.05rem;opacity:.92;max-width:400px}
  .giftbadge{position:absolute;top:-18px;inset-inline-end:12px;z-index:3;background:var(--rose);color:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:8px 20px;font-size:clamp(21px,6vw,27px);line-height:1.2;transform:rotate(5deg);box-shadow:3px 3px 0 var(--ink);white-space:nowrap}
  @keyframes bwob{0%,100%{transform:rotate(4deg)}50%{transform:rotate(7deg) translateY(-3px)}}

  /* --- points, why, studied, kit, chips, reply: text up --- */
  .pt .tx b{font-size:21px}
  .pt .tx span{font-size:1.05rem;opacity:.85;color:#443305}
  .pt .n{transform:rotate(-5deg)}
  .pt:nth-child(2) .n{transform:rotate(4deg)}
  .why{font-size:clamp(21px,5.8vw,27px);max-width:500px}
  .st .bd b{font-size:clamp(21px,6vw,26px);line-height:1.25}
  .st .bd p{font-size:1.05rem;opacity:.92;color:#443305}
  .st .tag{font-size:14px;color:var(--acc,var(--ochre));transform:rotate(-3deg)}
  .st:nth-child(2) .tag{transform:rotate(2.5deg)}
  .qrhero .t b{font-size:20px}
  .qrhero .t span{font-size:1.02rem;opacity:.85}
  .atile b{font-size:17.5px}
  .atile .go{font-size:13.5px}
  .chip{font-size:1.05rem;border-color:var(--ink)}
  .chip svg{color:var(--acc,var(--rose))}
  .reply .handline{font-size:clamp(32px,9vw,46px);color:var(--rose)}
  .reply p{font-size:clamp(22px,6vw,30px)}

  /* --- marker highlight swipe (wobbly edge, palette) --- */
  .hl{position:relative;white-space:nowrap;z-index:0}
  .hl::before{content:"";position:absolute;z-index:-1;inset:.06em -.16em;background:var(--sage);opacity:.55;border-radius:.35em .5em .4em .55em/.6em .35em .55em .4em;transform:rotate(-1.5deg)}
  h1 .u::after{opacity:.85;height:.32em}

  /* --- scroll reveals: block-level rise + stagger, toggle-safe --- */
  @media (prefers-reduced-motion: no-preference){
    .rv{opacity:0;transform:translateY(30px)}
    .rv.in{opacity:1;transform:translateY(0);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.9,.3,1.15)}
    .rv .stag{opacity:0;transform:translateY(26px)}
    .rv.in .stag{opacity:1;transform:translateY(0);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.9,.3,1.2)}
    .rv.in .stag:nth-child(2){transition-delay:.09s}
    .rv.in .stag:nth-child(3){transition-delay:.18s}
    .rv.in .stag:nth-child(4){transition-delay:.27s}
    .rv.in .stag:nth-child(5){transition-delay:.36s}
    .rv .hl::before{transform:rotate(-1.5deg) scaleX(0);transform-origin:left center}
    body.ar .rv .hl::before{transform-origin:right center}
    .rv.in .hl::before{transform:rotate(-1.5deg) scaleX(1);transition:transform .55s cubic-bezier(.65,0,.35,1) .3s}
    .rv h1 .u::after,.rv .u::after{transform:scaleX(0);transform-origin:left center}
    body.ar .rv .u::after{transform-origin:right center}
    .rv.in .u::after{transform:scaleX(1);transition:transform .6s cubic-bezier(.65,0,.35,1) .35s}
    .giftbadge{animation:bwob 3.2s ease-in-out infinite}
    .rv .giftbadge{opacity:0;transform:rotate(5deg) scale(1.6)}
    .rv.in .giftbadge{opacity:1;transform:rotate(5deg) scale(1);transition:opacity .35s ease .5s,transform .45s cubic-bezier(.2,.8,.3,1.3) .5s;animation:bwob 3.2s ease-in-out 1.2s infinite}
    .freecard.rv .was,.freecard.rv .big{opacity:0;transform:scale(1.5) rotate(2deg)}
    .freecard.rv.in .was{opacity:.75;transform:rotate(-2deg) scale(1);transition:opacity .4s ease .15s,transform .45s cubic-bezier(.2,.8,.3,1.25) .15s}
    .freecard.rv.in .big{opacity:1;transform:rotate(-1.5deg) scale(1);transition:opacity .4s ease .3s,transform .5s cubic-bezier(.2,.8,.3,1.25) .3s}
    .rv.in .atile.stag:hover{transform:translateY(-3px)}
  }
  /* safety net: if a webview freezes transition clocks, .done (added by JS
     ~1.2s after .in) drops the transition so final values apply instantly */
  .rv.done,.rv.done *,.rv.done ::before,.rv.done ::after{transition:none!important}
  @media (prefers-reduced-motion: reduce){
    .rv,.rv .stag,.giftbadge,.freecard .was,.freecard .big{opacity:1;transform:none;animation:none;transition:none}
    .giftbadge{transform:rotate(5deg)}
    .freecard .was{transform:rotate(-2deg);opacity:.75}
    .freecard .big{transform:rotate(-1.5deg)}
  }
</style>
</head>
<body>

<div class="top">
  <div class="bm">
    <span class="mark"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 5.5 33 12.6v14.8L20 34.5 7 27.4V12.6Z" fill="#FFFDF6" stroke="#382900" stroke-width="2" stroke-linejoin="round"/><path d="M7 12.6 20 19.7l13-7.1M20 19.7V34.5" fill="none" stroke="#382900" stroke-width="2" stroke-linejoin="round"/><path d="M20 5.5 33 12.6l-13 7.1L7 12.6Z" fill="#C3C59A" opacity=".55"/><circle cx="13" cy="24.5" r="2.1" fill="#D46C6E"/><rect x="24.3" y="22.6" width="4.2" height="6.6" rx="1" fill="#C79503"/></svg></span>
    <b><span data-en="BEYt" data-ar="بيت"></span><small><span data-en="Mar Mikhael · Beirut" data-ar="مار مخايل · بيروت"></span></small></b>
  </div>
  <button class="lang hintme" id="langbtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg><span id="langlabel">English</span></button>
</div>

<div class="wrap">

  <div class="hero">
    <div class="kick"><span data-en="A gift from Menu Sadah" data-ar="هدية من منيو سادة"></span></div>

    <!-- the cube-house assembles, ink line by ink line -->
    <div class="housebox" aria-hidden="true">
      <svg viewBox="0 0 200 190">

<script>
(function(){
  var lang='ar';
  var btn=document.getElementById('langbtn'), lbl=document.getElementById('langlabel');
  function setLang(l){
    lang=l;
    document.documentElement.lang=l; document.documentElement.dir=(l==='ar')?'rtl':'ltr';
    document.body.classList.toggle('ar', l==='ar');
    document.querySelectorAll('[data-en]').forEach(function(el){
      var v=el.getAttribute('data-'+l); if(v!=null) el.textContent=v;
      el.setAttribute('lang', l==='ar' ? 'ar' : 'en');
    });
    lbl.textContent=(l==='ar')?'English':'العربية';
  }
  btn.addEventListener('click', function(){ btn.classList.remove('hintme'); setLang(lang==='ar'?'en':'ar'); });
  setLang('en');

  /* scroll reveals: block-level only (toggle-safe, Arabic never split per letter).
     Hardened for webview failure modes:
     1. hide states are added only after two live rAF ticks, so a frozen
        animation clock means nothing is ever hidden;
     2. IntersectionObserver AND a passive scroll rect-sweep both reveal;
     3. .done (1.25s after .in) drops transitions so frozen transition
        clocks still snap to the final frame. */
  function landIn(el){
    if(el.classList.contains('in')) return;
    el.classList.add('in');
    setTimeout(function(){ el.classList.add('done'); }, 1250);
  }
  requestAnimationFrame(function(){ requestAnimationFrame(function(){
    var rv=[].slice.call(document.querySelectorAll('.hero h1,.hero .sub,.cta-lg,section,.reply'));
    rv.forEach(function(el){ el.classList.add('rv'); });
    [].slice.call(document.querySelectorAll('.points .pt,.studied .st,.agrid .atile,.chips .chip')).forEach(function(el){ el.classList.add('stag'); });
    var pending=rv.slice();
    function sweep(){
      pending=pending.filter(function(el){
        if(el.classList.contains('in')) return false;
        var r=el.getBoundingClientRect();
        if(r.top < window.innerHeight*.92 && r.bottom > 0){ landIn(el); return false; }
        return true;
      });
      if(!pending.length) window.removeEventListener('scroll', sweep);
    }
    if('IntersectionObserver' in window){
      var io=new IntersectionObserver(function(es){
        es.forEach(function(e){ if(e.isIntersecting){ landIn(e.target); io.unobserve(e.target); } });
      },{threshold:.15,rootMargin:'0px 0px -8% 0px'});
      rv.forEach(function(el){ io.observe(el); });
    }
    window.addEventListener('scroll', sweep, {passive:true});
    var iv=setInterval(function(){ sweep(); if(!pending.length) clearInterval(iv); }, 1100); /* timer sweep: survives frozen rAF + dead scroll events */
    sweep();
  }); });
})();
</script>
