<!doctype html>
<html lang="en" data-theme="hq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#161210">
<title>MENUS — ClientOS · MENU SADAH</title>
<style>
:root{--bg-0:#161210;--bg-1:#1f1915;--bg-2:#2a221b;--bg-3:#372c22;--border-1:#35291f;--border-2:#55422f;
--text-1:#f5efe6;--text-2:#c6b9a6;--text-3:#8b7d6a;--accent:#e3b23c;--accent-hover:#f0c45c;--on-accent:#1d1610;
--accent-soft:#e3b23c24;--positive:#57b380;--positive-soft:#57b38029;--negative:#e25c5c;--negative-soft:#e25c5c29;
--warning:#e8883c;--warning-soft:#e8883c29;--info:#5ca8e8;--r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:24px;
--font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Arial,sans-serif;
--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--bg-0);color:var(--text-1);font-family:var(--font);font-size:15px;display:flex;flex-direction:column}
button{font-family:var(--font);border:none;background:none;color:inherit;cursor:pointer}
/* ---------- header ---------- */
#hdr{flex:0 0 auto;background:var(--bg-1);border-bottom:1px solid var(--border-1);padding:10px 14px 8px;z-index:30}
#hdrRow1{display:flex;align-items:center;gap:8px;height:28px}
#hdrRow1 .t{font-size:17px;font-weight:800;letter-spacing:.08em}
#hdrRow1 .tAr{font-size:12px;color:var(--text-3)}
#hdrRow1 .sp{flex:1}
#signedPill{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--positive);background:var(--positive-soft);
border:1px solid #57b38040;border-radius:var(--r-sm);padding:3px 8px}
#xpStrip{display:flex;align-items:center;gap:8px;margin-top:6px;height:22px}
#rankBadge{font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.05em;white-space:nowrap}
#lvlTag{font-family:var(--mono);font-size:11px;color:var(--text-2)}
#xpBar{flex:1;height:6px;background:var(--bg-2);border-radius:99px;overflow:hidden}
#xpFill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),#f6d77e);border-radius:99px;
box-shadow:0 0 12px #e3b23c59;transition:width .32s var(--ease)}
#streakFlame{font-size:12px;color:var(--warning);font-weight:700;white-space:nowrap}
#stats{display:flex;gap:6px;margin-top:8px}
.pill{flex:1;height:44px;background:var(--bg-2);border:1px solid var(--border-1);border-radius:var(--r-md);
display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:all .12s}
.pill b{font-family:var(--mono);font-size:15px}
.pill span{font-size:8.5px;font-weight:600;letter-spacing:.06em;color:var(--text-3);text-transform:uppercase}
.pill.g b{color:var(--positive)} .pill.o b{color:var(--warning)} .pill.r b{color:var(--negative)} .pill.s b{color:var(--info)}
.pill.on{background:var(--bg-3)} .pill.g.on{border-color:var(--positive)} .pill.o.on{border-color:var(--warning)}
.pill.r.on{border-color:var(--negative)} .pill.s.on{border-color:var(--info)}
/* ---------- filters ---------- */
#filters{flex:0 0 auto;background:var(--bg-1);border-bottom:1px solid var(--border-1);padding:8px 0 6px;z-index:25}
#searchWrap{margin:0 12px;position:relative}
#search{width:100%;height:42px;background:var(--bg-0);border:1px solid var(--border-2);border-radius:var(--r-md);
color:var(--text-1);font-size:15px;padding:0 36px 0 12px;outline:none;transition:all .12s}
#search:focus{border-color:var(--accent);box-shadow:0 0 12px #e3b23c59}
#search::placeholder{color:var(--text-3)}
#clearBtn{position:absolute;right:4px;top:7px;width:28px;height:28px;color:var(--text-3);display:none;font-size:14px}
#chips{display:flex;gap:6px;overflow-x:auto;padding:8px 12px 2px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;height:30px;padding:0 12px;border-radius:var(--r-xl);background:var(--bg-2);
border:1px solid var(--border-1);font-size:12px;font-weight:600;color:var(--text-2);display:flex;align-items:center;gap:5px;transition:all .12s}
.chip .dot{width:8px;height:8px;border-radius:50%}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700}
.chip.on .dot{outline:1.5px solid var(--on-accent)}
/* ---------- list ---------- */
#list{flex:1;overflow-y:auto;overscroll-behavior:contain;position:relative}
#resultLine{position:sticky;top:0;z-index:5;height:26px;line-height:26px;padding:0 14px;background:var(--bg-0);
font-family:var(--mono);font-size:11px;color:var(--text-3)}
#spacer{position:relative}
.row{position:absolute;left:0;width:100%;height:76px;display:flex;align-items:center;gap:10px;
padding:0 12px;border-bottom:1px solid var(--border-1);background:transparent;transition:background 80ms}
.row:active{background:var(--bg-2)}
.bub{flex:0 0 40px;width:40px;height:40px;border-radius:50%;position:relative}
.bub.G{background:radial-gradient(circle at 30% 30%,#7ed9a573,#57b3808c 45%,#3d8a5fd9 100%);border:1px solid #57b38066;box-shadow:0 0 12px #57b38059}
.bub.O{background:radial-gradient(circle at 30% 30%,#f2a96473,#e8883c8c 45%,#b5641fd9 100%);border:1px solid #e8883c66}
.bub.R{background:radial-gradient(circle at 30% 30%,#ef8a8a73,#e25c5c8c 45%,#b03a3ad9 100%);border:1px solid #e25c5c66}
.bub .ck{position:absolute;right:-4px;bottom:-2px;width:16px;height:16px;border-radius:50%;background:var(--accent);
color:var(--on-accent);font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center}
.txt{flex:1;min-width:0}
.l1{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l1 .star{color:var(--accent);font-size:12px}
.l2{font-size:12px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.l3{font-size:11px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.l3 .st{font-family:var(--mono);font-size:10px;text-transform:uppercase;font-weight:700}
.st.READY{color:var(--positive)}.st.SENT{color:var(--info)}.st.REPLIED{color:var(--warning)}.st.SIGNED{color:var(--accent)}
.l3 .chain{color:var(--negative)}
.acts{flex:0 0 auto;display:flex;gap:5px}
.ab{width:36px;height:36px;border-radius:var(--r-sm);background:var(--bg-2);border:1px solid var(--border-1);
font-size:15px;display:flex;align-items:center;justify-content:center;color:var(--text-2);transition:transform 80ms}
.ab:active{transform:scale(.92)}
.ab.gift{color:var(--accent)}
.ab.ok{background:var(--positive);border-color:var(--positive);color:var(--on-accent)}
#empty{display:none;text-align:center;padding:60px 20px;color:var(--text-3)}
#empty .ghost{width:44px;height:44px;border:2px dashed var(--border-2);border-radius:50%;margin:0 auto 12px}
#empty button{color:var(--accent);font-size:13px;margin-top:8px}
#fab{position:fixed;right:12px;bottom:80px;width:38px;height:38px;border-radius:50%;background:var(--accent);
color:var(--on-accent);font-size:15px;box-shadow:0 0 12px #e3b23c59;display:none;z-index:20}
/* ---------- footer nav ---------- */
#nav{flex:0 0 auto;height:60px;background:#1f1915eb;border-top:1px solid var(--border-1);display:flex;z-index:30}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
font-size:17px;color:var(--text-3)}
#nav button span{font-size:9px;font-weight:600;letter-spacing:.04em}
#nav button.on{color:var(--accent)}
#nav button.pulse{animation:coachpulse 1.2s infinite}
@keyframes coachpulse{50%{opacity:.35}}
/* ---------- sheets ---------- */
.sheet{position:fixed;inset:0;background:#0c0907b8;backdrop-filter:blur(8px);z-index:40;display:none;align-items:flex-end}
.sheet.open{display:flex}
.card{width:100%;max-height:78%;overflow-y:auto;background:var(--bg-1);border-top:1px solid var(--border-2);
border-radius:var(--r-xl) var(--r-xl) 0 0;padding:18px 16px 26px;animation:up .24s var(--ease)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.card h2{font-size:15px;letter-spacing:.08em;margin-bottom:12px;color:var(--accent)}
.card h2 small{color:var(--text-3);font-weight:400;letter-spacing:0}
.qi{display:flex;gap:10px;align-items:center;background:var(--bg-2);border:1px solid var(--border-1);
border-radius:var(--r-md);padding:12px;margin-bottom:8px}
.qi .qc{width:26px;height:26px;border-radius:50%;border:2px solid var(--border-2);flex:0 0 auto;
display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--on-accent)}
.qi.done .qc{background:var(--positive);border-color:var(--positive)}
.qi .qt{flex:1;font-size:13.5px}
.qi .qt small{display:block;color:var(--text-3);font-size:11px;margin-top:1px}
.qi .qx{font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:700}
.rk{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--border-1)}
.rk .em{width:30px;height:30px;border-radius:50%;background:var(--bg-3);display:flex;align-items:center;justify-content:center;font-size:14px}
.rk.cur .em{background:var(--accent);color:var(--on-accent);box-shadow:0 0 12px #e3b23c59}
.rk .rn{flex:1;font-size:13.5px;font-weight:600}
.rk .rn small{display:block;color:var(--text-3);font-weight:400;font-size:11px}
.rk .rx{font-family:var(--mono);font-size:11px;color:var(--text-3)}
.rk.lock{opacity:.55}
.statrow{display:flex;gap:8px;margin:12px 0}
.statrow div{flex:1;text-align:center;background:var(--bg-2);border-radius:var(--r-md);padding:8px 4px}
.statrow b{font-family:var(--mono);font-size:15px;display:block}
.statrow span{font-size:9px;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em}
.ghostBtn{width:100%;margin-top:10px;height:40px;border:1px solid var(--border-2);border-radius:var(--r-md);
color:var(--text-2);font-size:13px}
/* ---------- coach ---------- */
#coach{position:fixed;inset:0;z-index:50;display:none}
#coach.open{display:block}
#coachScrim{position:absolute;inset:0}
#spot{position:absolute;border-radius:12px;box-shadow:0 0 0 9999px #0c0907d2;transition:all .25s var(--ease);pointer-events:none}
#coachCard{position:absolute;left:16px;right:16px;background:var(--bg-1);border:1px solid var(--border-2);
border-radius:var(--r-lg);padding:14px;box-shadow:0 12px 32px #00000059}
#coachCard .cn{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.05em}
#coachCard .ce{font-size:14px;margin-top:6px}
#coachCard .ca{font-size:13px;margin-top:4px;color:var(--text-2);direction:rtl;text-align:right}
#coachCard .cf{display:flex;align-items:center;margin-top:12px;gap:8px}
#coachCard .cf .num{font-family:var(--mono);font-size:11px;color:var(--text-3);flex:1}
#coachCard .cf button{height:34px;padding:0 16px;border-radius:var(--r-sm);font-size:13px;font-weight:700}
#coachCard .back{border:1px solid var(--border-2);color:var(--text-2)}
#coachCard .next{background:var(--accent);color:var(--on-accent)}
/* ---------- toast + xp chips ---------- */
#toasts{position:fixed;left:12px;right:12px;bottom:72px;z-index:60;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{background:var(--bg-3);border:1px solid var(--positive);border-radius:var(--r-md);padding:10px 14px;
font-size:13px;animation:up .16s var(--ease)}
.toast.warn{border-color:var(--warning)}
.xpchip{position:fixed;z-index:60;font-family:var(--mono);font-size:13px;font-weight:800;color:var(--accent);
pointer-events:none;animation:rise .8s var(--ease) forwards}
.xpchip.big{color:var(--positive)}
@keyframes rise{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-24px)}}
/* ---------- signed flash ---------- */
#flash{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;flex-direction:column;
background:radial-gradient(circle,#e3b23c33,#0c0907e6 70%)}
#flash.open{display:flex}
#flash h1{font-size:34px;color:var(--accent);text-shadow:0 0 24px #e3b23c88}
#flash p{color:var(--text-1);margin-top:8px;font-size:16px}
#flash .fx{font-family:var(--mono);font-size:26px;color:var(--positive);margin-top:14px;font-weight:800}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div class="sheet" id="questSheet"><div class="card">

</div></div>

<div id="coach">

];
let coachStep = 0;
const coachEl = document.getElementById('coach');
function coachShow(i){
  coachStep = Math.max(0, Math.min(COACH.length - 1, i));
  const c = COACH[coachStep];
  let el = document.querySelector(c.sel);
  if (!el) { el = document.getElementById('hdr'); }
  el.scrollIntoView && el.scrollIntoView({block:'center'});
  setTimeout(() => {
    const r = el.getBoundingClientRect();
    const spot = document.getElementById('spot');
    spot.style.left = (r.left - 6) + 'px'; spot.style.top = (r.top - 6) + 'px';
    spot.style.width = (r.width + 12) + 'px'; spot.style.height = (r.height + 12) + 'px';
    const card = document.getElementById('coachCard');
    card.querySelector('.cn').textContent = c.name;
    card.querySelector('.ce').textContent = c.en;
    card.querySelector('.ca').textContent = c.ar;
    card.querySelector('.num').textContent = (coachStep + 1) + ' / ' + COACH.length;
    card.querySelector('.next').textContent = coachStep === COACH.length - 1 ? 'GG ✓' : 'Next ›';
    const below = r.top < window.innerHeight / 2;
    card.style.top = below ? Math.min(window.innerHeight - 220, r.bottom + 14) + 'px' : '';
    card.style.bottom = below ? '' : (window.innerHeight - r.top + 14) + 'px';
    if (!below) card.style.top = 'auto';
  }, 60);
}
document.getElementById('navCoach').addEventListener('click', () => { SFX.click(); coachEl.classList.add('open'); coachShow(0); });
document.querySelector('#coachCard .next').addEventListener('click', () => { SFX.click();
  if (coachStep === COACH.length - 1){ coachEl.classList.remove('open'); store.set('gameos_coach_done', true); }
  else coachShow(coachStep + 1); });
document.querySelector('#coachCard .back').addEventListener('click', () => { SFX.click(); coachShow(coachStep - 1); });
document.getElementById('coachScrim').addEventListener('click', () => { coachEl.classList.remove('open');
  if (coachStep >= 2) store.set('gameos_coach_done', true); });
/* first launch: pulse the coach */
if (!store.get('gameos_coach_done', false)) document.getElementById('navCoach').classList.add('pulse');
document.getElementById('navCoach').addEventListener('click', function(){ this.classList.remove('pulse'); });
/* music nav initial state */
document.getElementById('navMusic').classList.toggle('on', musicOn);
document.getElementById('navMute').firstChild.textContent = muted ? '🔇' : '🔊';
/* ================= BOOT ================= */
paintCounts(); paintHUD(); applyFilter(); checkQuests();
