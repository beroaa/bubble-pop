<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Three Coffee — Table Card (Print A6)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --card:#FBF4E8; --ink:#241A10; --ink-dim:#6E5C44; --copper:#B57A3E;
    --en:"Sora",system-ui,sans-serif; --ar:"IBM Plex Sans Arabic",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  @page{size:105mm 148mm;margin:0}
  body{background:#3a2e20;display:flex;justify-content:center;padding:24px;font-family:var(--en)}
  .card{
    width:105mm;height:148mm;background:var(--card);color:var(--ink);
    display:flex;flex-direction:column;align-items:center;text-align:center;
    padding:11mm 10mm 9mm;box-shadow:0 12px 40px rgba(0,0,0,.45);
  }
  @media print{
    body{background:none;padding:0;display:block}
    .card{box-shadow:none;page-break-after:always}
  }
  .rings{width:13mm;height:13mm;margin-bottom:4.5mm}
  .brand{font-weight:800;font-size:19pt;letter-spacing:.32em;text-indent:.32em;line-height:1}
  .brand-ar{font-family:var(--ar);font-weight:500;font-size:11pt;color:var(--ink-dim);margin-top:2.5mm}
  .rule{width:14mm;height:.6mm;background:var(--copper);margin:5mm 0 6mm}
  .qrbox{
    width:52mm;height:52mm;padding:4mm;background:#fff;
    border:.5mm solid var(--copper);border-radius:3mm;
  }
  .qrbox svg{width:100%;height:100%;display:block}
  .scan-en{margin-top:5.5mm;font-weight:700;font-size:10.5pt;letter-spacing:.06em}
  .scan-ar{font-family:var(--ar);font-weight:500;font-size:9.5pt;color:var(--ink-dim);margin-top:1.6mm}
  .url{
    margin-top:4mm;font-weight:600;font-size:8pt;letter-spacing:.12em;
    color:var(--copper);text-transform:lowercase;
  }
  .foot{margin-top:auto;font-size:6.5pt;letter-spacing:.14em;color:var(--ink-dim);text-transform:uppercase}
  .foot .ar{font-family:var(--ar);letter-spacing:0;text-transform:none;display:block;margin-top:1.2mm;font-size:7.5pt}
</style>
</head>
