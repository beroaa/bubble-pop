<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Maison de Cofleur — Table Cards (Print)</title>
<style>
@font-face { font-family:'Jost'; src:url('../fonts/jost-400-latin.woff2') format('woff2'); font-weight:400; }
@font-face { font-family:'Poppins'; src:url('../fonts/poppins-300-latin.woff2') format('woff2'); font-weight:300; }
@font-face { font-family:'Almarai'; src:url('../fonts/almarai-700-arabic.woff2') format('woff2'); font-weight:700; }
*{margin:0;padding:0;box-sizing:border-box}
body{background:#e9e2d8;font-family:'Poppins',sans-serif}
.sheet{width:210mm;height:296mm;background:#fff;margin:0 auto;position:relative;page-break-after:always;
  display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.cell{display:grid;place-items:center;border:.25mm dashed #c9b9a5;position:relative}
.card{width:92mm;height:135mm;background:#fff8f2;border:.4mm solid rgba(166,123,81,.35);border-radius:6mm;
  display:flex;flex-direction:column;align-items:center;text-align:center;padding:9mm 8mm 7mm}
.c-bloom{width:26mm;height:15mm}
.c-word{width:56mm;margin-top:3mm}
.c-qr{width:52mm;height:52mm;margin-top:7mm;border-radius:3mm}
.c-menu{font-family:'Jost';font-size:13pt;letter-spacing:.35em;color:#3f3227;margin-top:6mm;text-indent:.35em}
.c-menu span{display:block;font-family:'Almarai';font-weight:700;font-size:10.5pt;letter-spacing:0;color:#8a6540;margin-top:1mm;text-indent:0}
.c-scan{font-weight:300;font-size:8pt;color:#877663;margin-top:4mm}
.c-scan span{font-family:'Almarai';font-weight:700}
.c-ig{font-family:'Jost';font-size:7.5pt;letter-spacing:.22em;color:#b1a37e;margin-top:auto}
@media print{ body{background:#fff} .cell{border-color:#eee} }
@page{size:A4;margin:0}
</style>
</head>
