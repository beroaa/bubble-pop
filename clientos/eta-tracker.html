<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>ETA · ClientOS — Menu Sadah</title>
<style>
  :root {
    --bg: #100E09;
    --card: #1C1810;
    --card-edge: rgba(217, 174, 86, 0.10);
    --ink: #F2EFE7;
    --ink-2: #B9B2A2;
    --ink-3: #7E786B;
    --gold: #D9AE56;
    --gold-ink: #1A1508;
    --good: #64D695;
    --soon: #EFBE45;
    --late: #E04B55;
    --done: #8F97A3;
    --track: rgba(255, 255, 255, 0.07);
    --radius: 16px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { height: 100%; }
  body {
    min-height: 100%;
    background: radial-gradient(120% 80% at 50% 0%, #17130B 0%, var(--bg) 55%);
    color: var(--ink);
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Noto Sans Arabic", "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    padding: 16px 14px calc(24px + env(safe-area-inset-bottom, 0px));
    max-width: 520px;
    margin: 0 auto;
  }

  header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }
  header h1 { font-size: 17px; font-weight: 700; letter-spacing: 0.2px; }
  header h1 .medal { margin-right: 6px; }
  .offline-badge {
    font-size: 11px; color: var(--ink-3);
    border: 1px solid var(--card-edge);
    padding: 4px 9px; border-radius: 999px;
    white-space: nowrap;
  }
  .offline-badge.storage-warn { color: var(--late); border-color: var(--late); }

  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 14px; }
  .tile {
    min-width: 0;
    background: var(--card);
    border: 1px solid var(--card-edge);
    border-radius: var(--radius);
    padding: 12px 10px 10px;
    text-align: center;
  }
  .tile .num {
    font-size: 30px; font-weight: 800; line-height: 1.1;
    font-variant-numeric: tabular-nums;
    transition: transform 0.25s cubic-bezier(0.2, 0.7, 0.3, 1);
  }
  .tile .lbl { font-size: 11px; color: var(--ink-2); margin-top: 2px; }
  .tile.t-soon .num { color: var(--soon); }
  .tile.t-late .num { color: var(--late); }

  form.add {
    background: var(--card);
    border: 1px solid var(--card-edge);
    border-radius: var(--radius);
    padding: 12px;
    display: grid; gap: 8px;
    margin-bottom: 16px;
  }
  .row2 { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 8px; }
  input[type="text"], input[type="datetime-local"] {
    width: 100%;
    min-width: 0;
    background: #14110A;
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 10px;
    color: var(--ink);
    font: inherit;
    padding: 10px 11px;
    min-height: 42px;
    transition: border-color 0.18s ease;
    color-scheme: dark;
  }
  input::placeholder { color: var(--ink-3); }
  input:focus-visible { outline: none; border-color: var(--gold); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    font: inherit; font-size: 12px;
    color: var(--ink-2);
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 999px;
    padding: 6px 11px;
    cursor: pointer;
    transition: color 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
  }
  .chip:hover { color: var(--ink); border-color: var(--gold); }
  .chip:active { transform: scale(0.96); }
  .btn {
    font: inherit; font-weight: 700;
    border: 0; border-radius: 10px;
    min-height: 44px;
    padding: 10px 14px;
    cursor: pointer;
    transition: transform 0.15s ease, filter 0.15s ease, background 0.15s ease, color 0.15s ease;
  }
  .btn:active { transform: scale(0.97); }
  .btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .btn-gold { background: var(--gold); color: var(--gold-ink); }
  .btn-gold:hover { filter: brightness(1.07); }
  .btn-ghost {
    background: transparent; color: var(--ink-2);
    border: 1px solid rgba(255, 255, 255, 0.12);
    font-weight: 600;
  }
  .btn-ghost:hover { color: var(--ink); border-color: var(--gold); }

  .shake { animation: shake 0.3s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }

  #list { display: grid; gap: 10px; }
  .divider {
    font-size: 11px; font-weight: 700; letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--ink-3);
    margin: 8px 2px 0;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--card-edge);
    border-radius: var(--radius);
    padding: 13px 13px 12px;
    animation: rise 0.24s cubic-bezier(0.2, 0.7, 0.3, 1);
  }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  .card.leaving { opacity: 0; transform: scale(0.96); transition: opacity 0.18s ease, transform 0.18s ease; }
  .card-top { display: flex; align-items: baseline; gap: 8px; }
  .card .name {
    font-weight: 700; font-size: 15.5px;
    overflow-wrap: anywhere;
    flex: 1;
  }
  .tag {
    font-size: 11px; color: var(--gold);
    border: 1px solid rgba(217, 174, 86, 0.35);
    border-radius: 999px;
    padding: 2px 8px;
    max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .card-mid { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; gap: 8px; }
  .pill {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12px; font-weight: 700;
    border-radius: 999px;
    padding: 3px 10px;
    transition: transform 0.2s ease;
  }
  .countdown {
    font-size: 19px; font-weight: 800;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .card[data-status="ontrack"] .pill { color: var(--good); background: rgba(100, 214, 149, 0.12); }
  .card[data-status="soon"]    .pill { color: var(--soon); background: rgba(239, 190, 69, 0.12); }
  .card[data-status="late"]    .pill { color: var(--late); background: rgba(224, 75, 85, 0.13); }
  .card[data-status="done"]    .pill { color: var(--done); background: rgba(143, 151, 163, 0.14); }
  .card[data-status="ontrack"] .bar-fill, .card[data-status="done"] .bar-fill { background: var(--good); }
  .card[data-status="soon"] .bar-fill { background: var(--soon); }
  .card[data-status="late"] .bar-fill { background: var(--late); }
  .card[data-status="late"] .countdown { color: var(--late); }
  .card[data-status="done"] { opacity: 0.72; }
  .card[data-status="done"] .countdown { font-size: 14px; font-weight: 600; color: var(--ink-2); }
  .pill.pop { animation: pop 0.3s cubic-bezier(0.2, 0.7, 0.3, 1); }
  @keyframes pop { 50% { transform: scale(1.18); } }

  .bar { height: 6px; background: var(--track); border-radius: 3px; margin-top: 9px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 3px; width: 0%; transition: width 0.5s linear, background 0.3s ease; }

  .card-foot {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 8px; gap: 8px;
  }
  .when { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .acts { display: flex; gap: 4px; }
  .icon-btn {
    font: inherit; font-size: 15px;
    background: transparent; border: 0;
    color: var(--ink-3);
    width: 40px; height: 40px;
    border-radius: 10px;
    cursor: pointer;
    transition: color 0.15s ease, background 0.15s ease, transform 0.15s ease;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .icon-btn:hover { color: var(--ink); background: rgba(255, 255, 255, 0.06); }
  .icon-btn:active { transform: scale(0.92); }
  .icon-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
  .icon-btn.confirm { color: var(--late); font-size: 12px; font-weight: 700; width: auto; padding: 0 10px; }

  .edit-form { display: grid; gap: 8px; }
  .edit-acts { display: flex; gap: 8px; justify-content: flex-end; }

  .empty {
    text-align: center;
    color: var(--ink-3);
    padding: 34px 16px;
    border: 1px dashed rgba(255, 255, 255, 0.12);
    border-radius: var(--radius);
  }
  .empty .big { font-size: 30px; margin-bottom: 8px; }

  footer {
    margin-top: 18px;
    display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap;
  }
  footer .note { flex-basis: 100%; text-align: center; font-size: 11px; color: var(--ink-3); margin-top: 8px; }

  #toast {
    position: fixed; left: 50%; bottom: 24px;
    transform: translate(-50%, 80px);
    background: #262013;
    border: 1px solid var(--card-edge);
    color: var(--ink);
    font-size: 13px;
    padding: 10px 16px;
    border-radius: 12px;
    opacity: 0;
    transition: transform 0.28s cubic-bezier(0.2, 0.7, 0.3, 1), opacity 0.28s ease;
    max-width: 90vw;
    text-align: center;
    pointer-events: none;
    z-index: 10;
  }
  #toast.show { transform: translate(-50%, 0); opacity: 1; }
  #toast.err { border-color: var(--late); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
  <header>
    <h1><span class="medal">🎖</span>ClientOS · ETA</h1>
    <span class="offline-badge" id="badge">Offline · saved locally</span>
  </header>

  <div class="stats" aria-label="Summary">
    <div class="tile"><div class="num" id="statActive">0</div><div class="lbl">● Active</div></div>
    <div class="tile t-soon"><div class="num" id="statSoon">0</div><div class="lbl">◑ Due &lt; 24h</div></div>
    <div class="tile t-late"><div class="num" id="statLate">0</div><div class="lbl">▲ Overdue</div></div>
  </div>

  <form class="add" id="addForm" autocomplete="off">
    <input type="text" id="inName" dir="auto" maxlength="80" placeholder="Client / job — e.g. RUSTIC menu v2" aria-label="Job name">
    <div class="row2">
      <input type="datetime-local" id="inWhen" aria-label="Deadline">
      <input type="text" id="inTag" dir="auto" maxlength="24" placeholder="tag" aria-label="Tag (optional)">
    </div>
    <div class="chips" role="group" aria-label="Quick deadlines">
      <button type="button" class="chip" data-chip="1h">+1h</button>
      <button type="button" class="chip" data-chip="4h">+4h</button>
      <button type="button" class="chip" data-chip="tmrw">Tomorrow 9am</button>
      <button type="button" class="chip" data-chip="3d">+3 days</button>
      <button type="button" class="chip" data-chip="1w">+1 week</button>
    </div>
    <button class="btn btn-gold" type="submit">Add to board</button>
  </form>

  <div id="list" aria-live="polite"></div>

  <footer>
    <button class="btn btn-ghost" type="button" id="btnExport">⬇ Backup</button>
    <button class="btn btn-ghost" type="button" id="btnImport">⬆ Restore</button>
    <button class="btn btn-ghost" type="button" id="btnClearDone">Clear delivered</button>
    <input type="file" id="fileImport" accept=".json,application/json" hidden>
    <div class="note">100% offline — everything stays on this Mac. Backup before big changes.</div>
  </footer>

  <div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
(function () {
  var KEY = 'menu-sadah.eta.v1';
  var DAY = 86400000, HOUR = 3600000, MIN = 60000;
  var STATUS = {
    ontrack: { glyph: '●', label: 'On track' },
    soon:    { glyph: '◑', label: 'Due soon' },
    late:    { glyph: '▲', label: 'Overdue' },
    done:    { glyph: '✓', label: 'Delivered' }
  };

  var state = { v: 1, jobs: [] };
  var refs = new Map();          // job id -> live DOM nodes patched by tick()
  var editingId = null;
  var storageOk = true;
  var confirmTimers = new Map();
  var lastStats = { a: -1, s: -1, l: -1 };

  var $ = function (id) { return document.getElementById(id); };
  var listEl = $('list'), badgeEl = $('badge'), toastEl = $('toast');

  function makeId() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
  }

  function sanitizeJob(raw) {
    if (!raw || typeof raw !== 'object') return null;
    var name = (typeof raw.name === 'string' ? raw.name : '').trim().slice(0, 80);
    var deadline = Number(raw.deadline);
    if (!name || !isFinite(deadline)) return null;
    var createdAt = Number(raw.createdAt);
    if (!isFinite(createdAt)) createdAt = Date.now();
    var doneAt = Number(raw.doneAt);
    return {
      id: (typeof raw.id === 'string' && raw.id) ? raw.id.slice(0, 64) : makeId(),
      name: name,
      tag: (typeof raw.tag === 'string' ? raw.tag : '').trim().slice(0, 24),
      createdAt: createdAt,
      deadline: deadline,
      doneAt: isFinite(doneAt) && doneAt > 0 ? doneAt : null
    };
  }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return;
      var parsed = JSON.parse(raw);
      var arr = Array.isArray(parsed) ? parsed : (parsed && Array.isArray(parsed.jobs) ? parsed.jobs : []);
      var jobs = [], seen = new Set();
      for (var i = 0; i < arr.length; i++) {
        var j = sanitizeJob(arr[i]);
        if (j && !seen.has(j.id)) { seen.add(j.id); jobs.push(j); }
      }
      state.jobs = jobs;
    } catch (e) {
      state.jobs = [];
    }
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
      if (!storageOk) { storageOk = true; renderBadge(); }
    } catch (e) {
      if (storageOk) { storageOk = false; renderBadge(); toast('⚠ Could not save — storage unavailable', true); }
    }
  }

  function renderBadge() {
    badgeEl.textContent = storageOk ? 'Offline · saved locally' : '⚠ Not saving';
    badgeEl.classList.toggle('storage-warn', !storageOk);
  }

  var toastTimer = null;
  function toast(msg, isErr) {
    toastEl.textContent = msg;
    toastEl.classList.toggle('err', !!isErr);
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 4000);
  }

  function statusOf(job, now) {
    if (job.doneAt) return 'done';
    var left = job.deadline - now;
    if (left < 0) return 'late';
    if (left < DAY) return 'soon';
    return 'ontrack';
  }

  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  function fmtSpan(ms) {
    var d = Math.floor(ms / DAY);
    var h = Math.floor((ms % DAY) / HOUR);
    var m = Math.floor((ms % HOUR) / MIN);
    var s = Math.floor((ms % MIN) / 1000);
    if (d >= 1) return d + 'd ' + h + 'h';
    if (h >= 1) return h + 'h ' + pad2(m) + 'm';
    if (m >= 10) return m + 'm';
    return m + 'm ' + pad2(s) + 's';
  }

  function fmtCountdown(job, now) {
    if (job.doneAt) return '✓ in ' + fmtSpan(Math.max(0, job.doneAt - job.createdAt));
    var left = job.deadline - now;
    if (left < 0) return fmtSpan(-left) + ' late';
    return fmtSpan(left);
  }

  function fmtWhen(ts) {
    try {
      return new Date(ts).toLocaleString([], { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    } catch (e) {
      return new Date(ts).toString().slice(0, 21);
    }
  }

  function progressOf(job, now) {
    if (job.doneAt) return 1;
    var span = job.deadline - job.createdAt;
    if (span <= 0) return 1;
    return Math.min(1, Math.max(0, (now - job.createdAt) / span));
  }

  function toLocalInput(ts) {
    var d = new Date(ts);
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) +
      'T' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }

  // ---------- render ----------

  function render() {
    for (var t of confirmTimers.values()) clearTimeout(t);
    confirmTimers.clear();
    refs.clear();
    var now = Date.now();

    var active = state.jobs.filter(function (j) { return !j.doneAt; })
      .sort(function (a, b) { return a.deadline - b.deadline; });
    var done = state.jobs.filter(function (j) { return !!j.doneAt; })
      .sort(function (a, b) { return b.doneAt - a.doneAt; });

    var frag = document.createDocumentFragment();

    if (!state.jobs.length) {
      var empty = el('div', 'empty');
      empty.appendChild(el('div', 'big', '🎖'));
      empty.appendChild(el('div', null, 'No jobs on the board yet.'));
      empty.appendChild(el('div', null, 'Add your first ETA above — RUSTIC energy.'));
      frag.appendChild(empty);
    } else {
      active.forEach(function (j) { frag.appendChild(renderCard(j, now)); });
      if (done.length) {
        if (active.length) frag.appendChild(el('div', 'divider', 'Delivered'));
        done.forEach(function (j) { frag.appendChild(renderCard(j, now)); });
      }
    }

    listEl.replaceChildren(frag);
    updateStats(now, true);
  }

  function renderCard(job, now) {
    var card = el('article', 'card');
    card.dataset.status = statusOf(job, now);

    if (editingId === job.id) {
      card.appendChild(renderEditForm(job));
      return card;
    }

    var top = el('div', 'card-top');
    var name = el('div', 'name', job.name);
    name.dir = 'auto';
    top.appendChild(name);
    if (job.tag) {
      var tag = el('span', 'tag', job.tag);
      tag.dir = 'auto';
      top.appendChild(tag);
    }
    card.appendChild(top);

    var mid = el('div', 'card-mid');
    var st = STATUS[card.dataset.status];
    var pill = el('span', 'pill', st.glyph + ' ' + st.label);
    var cd = el('span', 'countdown', fmtCountdown(job, now));
    mid.appendChild(pill);
    mid.appendChild(cd);
    card.appendChild(mid);

    var bar = el('div', 'bar');
    var fill = el('div', 'bar-fill');
    fill.style.width = (progressOf(job, now) * 100).toFixed(1) + '%';
    bar.appendChild(fill);
    card.appendChild(bar);

    var foot = el('div', 'card-foot');
    foot.appendChild(el('span', 'when', (job.doneAt ? '✓ ' + fmtWhen(job.doneAt) : '⏱ ' + fmtWhen(job.deadline))));
    var acts = el('div', 'acts');

    var doneBtn = el('button', 'icon-btn', job.doneAt ? '↩' : '✓');
    doneBtn.type = 'button';
    doneBtn.setAttribute('aria-label', job.doneAt ? 'Mark not delivered' : 'Mark delivered');
    doneBtn.addEventListener('click', function () { toggleDone(job.id); });
    acts.appendChild(doneBtn);

    var editBtn = el('button', 'icon-btn', '✎');
    editBtn.type = 'button';
    editBtn.setAttribute('aria-label', 'Edit');
    editBtn.addEventListener('click', function () { editingId = job.id; render(); });
    acts.appendChild(editBtn);

    var delBtn = el('button', 'icon-btn', '🗑');
    delBtn.type = 'button';
    delBtn.setAttribute('aria-label', 'Delete');
    delBtn.addEventListener('click', function () { onDelete(job.id, delBtn, card); });
    acts.appendChild(delBtn);

    foot.appendChild(acts);
    card.appendChild(foot);

    refs.set(job.id, { card: card, pill: pill, cd: cd, fill: fill, lastStatus: card.dataset.status, lastCd: cd.textContent });
    return card;
  }

  function renderEditForm(job) {
    var form = el('form', 'edit-form');
    var inName = el('input');
    inName.type = 'text'; inName.value = job.name; inName.maxLength = 80; inName.dir = 'auto';
    inName.setAttribute('aria-label', 'Job name');
    var row = el('div', 'row2');
    var inWhen = el('input');
    inWhen.type = 'datetime-local'; inWhen.value = toLocalInput(job.deadline);
    inWhen.setAttribute('aria-label', 'Deadline');
    var inTag = el('input');
    inTag.type = 'text'; inTag.value = job.tag; inTag.maxLength = 24; inTag.dir = 'auto'; inTag.placeholder = 'tag';
    inTag.setAttribute('aria-label', 'Tag');
    row.appendChild(inWhen); row.appendChild(inTag);

    var acts = el('div', 'edit-acts');
    var cancel = el('button', 'btn btn-ghost', 'Cancel');
    cancel.type = 'button';
    cancel.addEventListener('click', function () { editingId = null; render(); });
    var saveBtn = el('button', 'btn btn-gold', 'Save');
    saveBtn.type = 'submit';
    acts.appendChild(cancel); acts.appendChild(saveBtn);

    form.appendChild(inName); form.appendChild(row); form.appendChild(acts);
    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var name = inName.value.trim().slice(0, 80);
      var ts = inWhen.value ? new Date(inWhen.value).getTime() : NaN;
      if (!name) { inName.classList.add('shake'); setTimeout(function () { inName.classList.remove('shake'); }, 350); inName.focus(); return; }
      if (!isFinite(ts)) { inWhen.classList.add('shake'); setTimeout(function () { inWhen.classList.remove('shake'); }, 350); inWhen.focus(); return; }
      job.name = name;
      job.tag = inTag.value.trim().slice(0, 24);
      job.deadline = ts;
      editingId = null;
      save(); render();
    });
    form.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape') { editingId = null; render(); }
    });
    setTimeout(function () { inName.focus(); }, 0);
    return form;
  }

  // ---------- actions ----------

  function toggleDone(id) {
    var job = state.jobs.find(function (j) { return j.id === id; });
    if (!job) return;
    job.doneAt = job.doneAt ? null : Date.now();
    save(); render();
    if (job.doneAt) {
      var r = refs.get(id);
      if (r) { r.pill.classList.add('pop'); }
      toast('🎖 Delivered — ' + job.name);
    }
  }

  function onDelete(id, btn, card) {
    if (btn.classList.contains('confirm')) {
      clearTimeout(confirmTimers.get(id));
      confirmTimers.delete(id);
      card.classList.add('leaving');
      setTimeout(function () {
        state.jobs = state.jobs.filter(function (j) { return j.id !== id; });
        if (editingId === id) editingId = null;
        save(); render();
      }, 190);
      return;
    }
    btn.classList.add('confirm');
    btn.textContent = 'Sure?';
    confirmTimers.set(id, setTimeout(function () {
      btn.classList.remove('confirm');
      btn.textContent = '🗑';
      confirmTimers.delete(id);
    }, 3500));
  }

  $('addForm').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var inName = $('inName'), inWhen = $('inWhen'), inTag = $('inTag');
    var name = inName.value.trim().slice(0, 80);
    var ts = inWhen.value ? new Date(inWhen.value).getTime() : NaN;
    if (!name) { inName.classList.add('shake'); setTimeout(function () { inName.classList.remove('shake'); }, 350); inName.focus(); return; }
    if (!isFinite(ts)) { inWhen.classList.add('shake'); setTimeout(function () { inWhen.classList.remove('shake'); }, 350); inWhen.focus(); return; }
    state.jobs.push({
      id: makeId(),
      name: name,
      tag: inTag.value.trim().slice(0, 24),
      createdAt: Date.now(),
      deadline: ts,
      doneAt: null
    });
    inName.value = ''; inTag.value = ''; inWhen.value = '';
    save(); render();
    inName.focus();
  });

  document.querySelectorAll('.chip').forEach(function (chip) {
    chip.addEventListener('click', function () {
      var now = new Date(), d = new Date();
      switch (chip.dataset.chip) {
        case '1h': d = new Date(now.getTime() + HOUR); break;
        case '4h': d = new Date(now.getTime() + 4 * HOUR); break;
        case 'tmrw': d.setDate(d.getDate() + 1); d.setHours(9, 0, 0, 0); break;
        case '3d': d = new Date(now.getTime() + 3 * DAY); break;
        case '1w': d = new Date(now.getTime() + 7 * DAY); break;
      }
      $('inWhen').value = toLocalInput(d.getTime());
    });
  });

  $('btnExport').addEventListener('click', function () {
    try {
      var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'menu-sadah-eta-backup-' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      toast('Backup downloaded ⬇');
    } catch (e) {
      toast('Backup failed', true);
    }
  });

  $('btnImport').addEventListener('click', function () { $('fileImport').click(); });
  $('fileImport').addEventListener('change', function () {
    var file = this.files && this.files[0];
    this.value = '';
    if (!file) return;
    var reader = new FileReader();
    reader.onerror = function () { toast('Could not read that file', true); };
    reader.onload = function () {
      try {
        var parsed = JSON.parse(String(reader.result));
        var arr = Array.isArray(parsed) ? parsed : (parsed && Array.isArray(parsed.jobs) ? parsed.jobs : null);
        if (!arr) { toast('Not a valid backup file', true); return; }
        var existing = new Set(state.jobs.map(function (j) { return j.id; }));
        var added = 0, skipped = 0, invalid = 0;
        arr.forEach(function (raw) {
          var j = sanitizeJob(raw);
          if (!j) { invalid++; return; }
          if (existing.has(j.id)) { skipped++; return; }
          existing.add(j.id);
          state.jobs.push(j);
          added++;
        });
        save(); render();
        toast('Restored ' + added + ' job' + (added === 1 ? '' : 's') +
          (skipped ? ' · ' + skipped + ' already here' : '') +
          (invalid ? ' · ' + invalid + ' invalid' : ''));
      } catch (e) {
        toast('Not a valid backup file', true);
      }
    };
    reader.readAsText(file);
  });

  var clearArmed = false, clearTimer = null;
  $('btnClearDone').addEventListener('click', function () {
    var doneCount = state.jobs.filter(function (j) { return j.doneAt; }).length;
    if (!doneCount) { toast('Nothing delivered yet'); return; }
    if (!clearArmed) {
      clearArmed = true;
      this.textContent = 'Sure? removes ' + doneCount;
      clearTimer = setTimeout(function () {
        clearArmed = false;
        $('btnClearDone').textContent = 'Clear delivered';
      }, 3500);
      return;
    }
    clearTimeout(clearTimer);
    clearArmed = false;
    this.textContent = 'Clear delivered';
    if (editingId && state.jobs.some(function (j) { return j.id === editingId && j.doneAt; })) editingId = null;
    state.jobs = state.jobs.filter(function (j) { return !j.doneAt; });
    save(); render();
    toast('Board cleaned ✨');
  });

  // ---------- live tick ----------

  function updateStats(now, force) {
    var a = 0, s = 0, l = 0;
    state.jobs.forEach(function (j) {
      if (j.doneAt) return;
      a++;
      var st = statusOf(j, now);
      if (st === 'soon') s++;
      if (st === 'late') l++;
    });
    if (force || a !== lastStats.a) $('statActive').textContent = String(a);
    if (force || s !== lastStats.s) $('statSoon').textContent = String(s);
    if (force || l !== lastStats.l) $('statLate').textContent = String(l);
    lastStats = { a: a, s: s, l: l };
  }

  function tick() {
    var now = Date.now();
    state.jobs.forEach(function (job) {
      var r = refs.get(job.id);
      if (!r) return;
      var st = statusOf(job, now);
      if (st !== r.lastStatus) {
        r.card.dataset.status = st;
        r.pill.textContent = STATUS[st].glyph + ' ' + STATUS[st].label;
        r.lastStatus = st;
      }
      var cdText = fmtCountdown(job, now);
      if (cdText !== r.lastCd) {
        r.cd.textContent = cdText;
        r.lastCd = cdText;
      }
      if (!job.doneAt) r.fill.style.width = (progressOf(job, now) * 100).toFixed(1) + '%';
    });
    updateStats(now, false);
  }

  setInterval(tick, 1000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) tick(); });
  window.addEventListener('focus', tick);

  // another ClientOS window may write the same key; storage events only fire cross-window
  window.addEventListener('storage', function (ev) {
    if (ev.key !== KEY || editingId) return;
    load(); render();
  });

  load();
  render();
})();
</script>
</body>
</html>
